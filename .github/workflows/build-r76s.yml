name: Build NanoPi R76S Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev python3 \
            python3-distutils python3-pyelftools python3-setuptools rsync swig time unzip \
            zlib1g-dev file wget ccache subversion

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: downloads-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'package/kernel/mac80211/Makefile', 'package/firmware/linux-firmware/Makefile') }}
          restore-keys: |
            downloads-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('target/linux/rockchip/**', 'package/kernel/mac80211/**', 'package/kernel/linux/**', 'package/firmware/linux-firmware/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure NanoPi R76S
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r76s=y
          CONFIG_TARGET_KERNEL_PARTSIZE=32
          CONFIG_CCACHE=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_rockchip|friendlyarm_nanopi-r76s|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_CCACHE|CONFIG_PACKAGE_kmod-rtw88-8822cs|CONFIG_PACKAGE_rtl8822cs-bt-firmware|CONFIG_PACKAGE_kmod-bluetooth' .config

      - name: Configure ccache
        run: |
          mkdir -p .ccache
          ccache --set-config=cache_dir="$PWD/.ccache"
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: make -j"$(nproc)" V=s

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Prepare artifact
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d bin/targets/rockchip/armv8 ]; then
            cp -a bin/targets/rockchip/armv8 artifacts/
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r76s-firmware
          path: artifacts/
          if-no-files-found: error
