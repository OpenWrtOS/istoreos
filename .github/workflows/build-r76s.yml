name: Build NanoPi R76S Firmware

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag. Defaults to istoreos-<version>-r76s-rtl8822cs.
        required: false
        type: string

permissions:
  contents: write

env:
  OFFICIAL_R76S_URL: https://fw.koolcenter.com/iStoreOS/r76s

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev python3 \
            python3-distutils python3-pyelftools python3-setuptools rsync swig time unzip \
            zlib1g-dev file wget ccache subversion

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: downloads-${{ runner.os }}-official-r76s-${{ hashFiles('package/kernel/mac80211/Makefile', 'package/firmware/linux-firmware/Makefile') }}
          restore-keys: |
            downloads-${{ runner.os }}-official-r76s-
            downloads-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('target/linux/rockchip/**', 'package/kernel/mac80211/**', 'package/kernel/linux/**', 'package/firmware/linux-firmware/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Use official iStoreOS feeds
        run: |
          curl -fsSL "$OFFICIAL_R76S_URL/feeds.buildinfo" -o feeds.conf
          cat feeds.conf

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure official NanoPi R76S image
        run: |
          curl -fsSL "$OFFICIAL_R76S_URL/config.seed" -o .config.official
          awk '
            /^CONFIG_TARGET_MULTI_PROFILE=y$/ { next }
            /^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_/ { next }
            /^CONFIG_ALL_KMODS=y$/ { next }
            { print }
          ' .config.official > .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r76s=y
          # CONFIG_TARGET_MULTI_PROFILE is not set
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=256
          CONFIG_PACKAGE_kmod-rtw88-8822cs=y
          CONFIG_PACKAGE_kmod-bluetooth=y
          CONFIG_PACKAGE_rtl8822cs-bt-firmware=y
          CONFIG_CCACHE=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_rockchip|friendlyarm_nanopi-r76s|CONFIG_TARGET_MULTI_PROFILE|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_CCACHE|CONFIG_PACKAGE_kmod-rtw88-8822cs|CONFIG_PACKAGE_rtl8822cs-bt-firmware|CONFIG_PACKAGE_kmod-bluetooth|CONFIG_PACKAGE_luci-app-quickstart|CONFIG_PACKAGE_dockerd' .config

      - name: Configure ccache
        run: |
          mkdir -p .ccache
          ccache --set-config=cache_dir="$PWD/.ccache"
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: make -j"$(nproc)" V=s

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Prepare artifact
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d bin/targets/rockchip/armv8 ]; then
            find bin/targets/rockchip/armv8 -maxdepth 1 -type f \
              \( -name '*r76s*' -o -name 'profiles.json' -o -name 'config.buildinfo' -o -name 'feeds.buildinfo' -o -name 'version.buildinfo' \) \
              -exec cp -a {} artifacts/ \;
            cp -a .config artifacts/config.seed
            official_name="$(curl -fsSL "$OFFICIAL_R76S_URL/version.latest" | sed -n 's/^\[\(istoreos-[^]]*-r76s-squashfs\.img\.gz\)\].*/\1/p' | head -1)"
            official_name="${official_name:-istoreos-r76s-squashfs.img.gz}"
            firmware_name="${official_name/-r76s-squashfs.img.gz/-r76s-rtl8822cs-squashfs.img.gz}"
            firmware_path="$(find artifacts -maxdepth 1 -type f -name '*r76s*squashfs*.img.gz' | head -1)"
            if [ -n "$firmware_path" ]; then
              mv "$firmware_path" "artifacts/$firmware_name"
              echo "$firmware_name" > artifacts/firmware-name.txt
            fi
            (cd artifacts && rm -f sha256sums && sha256sum * > sha256sums)
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-r76s-firmware
          path: artifacts/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          firmware_name="$(cat artifacts/firmware-name.txt 2>/dev/null || echo istoreos-r76s-rtl8822cs-squashfs.img.gz)"
          default_tag="${firmware_name%-squashfs.img.gz}"
          tag="${INPUT_RELEASE_TAG:-$default_tag}"
          title="$firmware_name"
          notes=$'Built from the official iStoreOS R76S package configuration with RTL8822CS Wi-Fi/BT support enabled.\n\nFirmware files are attached below.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --title "$title" --notes "$notes"
          fi
